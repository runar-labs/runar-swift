included:
  - swift-common
  - swift-keys
  - swift-serializer
  - swift-serializer-macros
  - swift-transporter

excluded:
  - .build
  - .swiftpm
  - '**/.build/**'
  - '**/.swiftpm/**'
  - '**/*.pb.swift'
  - '**/Reference/**'
  - '**/RunarTransporter.xcworkspace/**'
  - 'swift-transporter/Sources/QuicSample/**'
  - 'swift-transporter/Sources/QuicIT/**'
  - 'swift-transporter/Tests/RunarTransporterTests/SecIdentityPOC.swift'
  - 'swift-transporter/Sources/RunarTransporter/DiscoveryProtobuf.swift'
  - '**/Examples/**'

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

file_length:
  warning: 800
  error: 1500

type_body_length:
  warning: 400
  error: 800

function_body_length:
  warning: 120
  error: 200

cyclomatic_complexity:
  warning: 25
  error: 35

identifier_name:
  min_length: 2
  validates_start_with_lowercase: false
  severity: warning
  excluded: [i, j, k, x, y, z, id, pk, hs, ps, dp, ch, ok, be, cs, dn, ca, km, pm, ap, an, ad, ev, em, ds, vb, cm]

trailing_comma:
  mandatory_comma: false

force_try:
  severity: warning


