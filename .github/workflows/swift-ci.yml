name: swift-ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install SwiftFormat and SwiftLint
        run: |
          brew update
          brew install swiftformat swiftlint

      - name: SwiftFormat (lint mode)
        run: |
          set -euo pipefail
          for dir in swift-common swift-keys swift-serializer swift-serializer-macros swift-transporter; do
            echo "Checking formatting in $dir"
            swiftformat --lint "$dir"
          done

      - name: SwiftLint (strict)
        run: |
          set -euo pipefail
          for dir in swift-common swift-keys swift-serializer swift-serializer-macros swift-transporter; do
            echo "SwiftLint in $dir (strict)"
            (cd "$dir" && swiftlint)
          done

  build-and-test:
    name: Build and Test (${{ matrix.package }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [ swift-common, swift-keys, swift-serializer, swift-serializer-macros, swift-transporter ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.package }}/.build
            ${{ matrix.package }}/.swiftpm
          key: ${{ runner.os }}-spm-${{ matrix.package }}-${{ hashFiles(format('{0}/Package.resolved', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.package }}-

      - name: Show Swift version
        run: swift --version

      - name: Build
        working-directory: ${{ matrix.package }}
        run: swift build

      - name: Test
        working-directory: ${{ matrix.package }}
        run: swift test


